<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050404">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Threshold. There are five doors. They only appear through glass.">
<title>Threshold</title>
<style>
/* Threshold: a camera-first mystery. The real world, desaturated and warm like old film; the doors drawn over it in thin gold. */
@font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 400 600; font-display: swap; src: url(fonts/cormorant-garamond.woff2) format('woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 400 600; font-display: swap; src: url(fonts/cormorant-garamond-italic.woff2) format('woff2'); }
@font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/dm-mono-400.woff2) format('woff2'); }
@font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/dm-mono-500.woff2) format('woff2'); }
:root {
  --void: #050404;
  --ivory: #F2EAD9;
  --gold: #E3C07A;
  --gold-dim: rgba(227, 192, 122, .42);
  --ember: #FFD9A0;
  --crimson: #B6453A;
  --mute: rgba(242, 234, 217, .58);
  --serif: "Cormorant Garamond", "Iowan Old Style", Garamond, Georgia, serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--void); color: var(--ivory); font-family: var(--serif); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }

/* the camera, graded like old film */
#cam, #still { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(.38) contrast(1.18) brightness(.74); transition: filter 1.2s ease, opacity 1.2s ease; }
#still { opacity: 0; }
#still.on { opacity: 1; filter: grayscale(1) sepia(.5) contrast(1.2) brightness(.4); }
#still.live { opacity: 1; }
body.dark #cam, body.dark #still.live { filter: grayscale(1) sepia(.3) contrast(1.4) brightness(.35); }
/* door V: a second, late reflection laid over the live one */
#ghost { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; mix-blend-mode: screen; filter: grayscale(1) sepia(.5) contrast(1.2) brightness(.95); transition: opacity 1.2s ease; }
#ghost.on { opacity: .34; }
#ghost.frozen { opacity: .66; }
#ghost.gone { opacity: 0; transition-duration: 2.8s; }
body.selfie #cam, body.selfie #ghost { transform: scaleX(-1); }
body.blink #cam, body.blink #still, body.blink #ghost { opacity: 0 !important; transition: opacity .35s ease; }
body.quake #cam, body.quake #still, body.quake #fx { animation: quake .5s linear; }
@keyframes quake { 20% { transform: translate(-5px, 3px); } 40% { transform: translate(4px, -4px); } 60% { transform: translate(-3px, 2px); } 80% { transform: translate(2px, -1px); } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#grain { position: fixed; inset: -50%; width: 200%; height: 200%; pointer-events: none; opacity: .16; mix-blend-mode: overlay; animation: grain .6s steps(6) infinite; }
@keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-6%, 4%); } 40% { transform: translate(3%, -7%); } 60% { transform: translate(-4%, -3%); } 80% { transform: translate(7%, 5%); } 100% { transform: translate(-2%, 6%); } }
#vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(5, 4, 4, .82) 100%); }

/* HUD */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--sat) + 14px) 20px 0; display: flex; justify-content: space-between; align-items: center; pointer-events: none; font-family: var(--mono); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--mute); }
#hud .door { color: var(--gold); }
#hud button { pointer-events: auto; padding: 8px 0 8px 12px; letter-spacing: .2em; color: var(--mute); }
#timer { font-variant-numeric: tabular-nums; }

/* narration */
#story { position: fixed; left: 0; right: 0; bottom: calc(var(--sab) + 54px); padding: 0 28px; display: grid; justify-items: center; gap: 10px; text-align: center; pointer-events: none; }
#story p { margin: 0; max-width: 26ch; font: italic 400 25px/1.25 var(--serif); color: var(--ivory); text-shadow: 0 1px 18px rgba(0, 0, 0, .9); opacity: 0; transform: translateY(8px); transition: opacity 1.4s ease, transform 1.4s ease; text-wrap: balance; }
#story p.on { opacity: 1; transform: none; }
#story p.small { max-width: none; font: 400 11px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); font-style: normal; }

/* full screens (splash, interludes, endings) */
.screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: calc(var(--sat) + 40px) 30px calc(var(--sab) + 40px); background: var(--void); text-align: center; overflow-y: auto; touch-action: pan-y; }
.screen .col { display: grid; justify-items: center; gap: 18px; max-width: 360px; }
.eyebrow { margin: 0; font: 400 11px var(--mono); letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
.title { margin: 0; font: 500 clamp(36px, 11vw, 54px)/1 var(--serif); letter-spacing: .22em; text-indent: .22em; color: var(--ivory); }
.lead { margin: 0; font: italic 400 23px/1.3 var(--serif); color: var(--ivory); text-wrap: balance; }
.fine { margin: 0; font: 400 15px/1.45 var(--serif); color: var(--mute); max-width: 32ch; text-wrap: pretty; }
.count { margin: -8px 0 0; font: 400 11px var(--mono); letter-spacing: .26em; text-transform: uppercase; color: var(--gold); }
.note { margin: 0; padding: 2px 0 2px 16px; border-left: 1px solid var(--gold-dim); font: 400 13px/2 var(--mono); color: var(--ivory); text-align: left; white-space: pre-line; justify-self: stretch; }
.msgs { display: grid; gap: 12px; justify-self: stretch; text-align: left; }
.msgs p { margin: 0; display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: baseline; font: italic 400 21px/1.3 var(--serif); }
.msgs time { font: 400 11px var(--mono); letter-spacing: .14em; color: var(--gold); }
.line { opacity: 0; transform: translateY(8px); transition: opacity 1.4s ease, transform 1.4s ease; }
.line.on { opacity: 1; transform: none; }
.actions { display: grid; gap: 12px; justify-items: center; margin-top: 8px; }
.go { padding: 15px 30px; border: 1px solid var(--gold-dim); border-radius: 999px; font: 400 12px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--gold); background: rgba(227, 192, 122, .05); transition: background .3s ease, border-color .3s ease; }
.go:active, .go:hover { background: rgba(227, 192, 122, .14); border-color: var(--gold); }
.go.dim { color: var(--mute); border-color: rgba(242, 234, 217, .22); background: none; }
.ghost { font: 400 11px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--mute); padding: 10px; }
.sigil-big { width: 150px; height: 150px; }
.sigil-big path, .sigil-big circle, .sigil-big line { fill: none; stroke: var(--gold); stroke-width: 1.1; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 3.6s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.marks { display: flex; gap: 14px; justify-content: center; margin: 4px 0; }
.marks svg { width: 46px; height: 46px; }
.marks svg * { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; }
.marks svg.locked * { stroke: rgba(242, 234, 217, .18); }

/* settings, toast */
#gear { position: fixed; top: calc(var(--sat) + 8px); right: 10px; z-index: 30; width: 44px; height: 44px; display: grid; place-items: center; color: var(--mute); }
#gear svg { width: 20px; height: 20px; }
#sheet { position: fixed; inset: 0; z-index: 45; display: grid; align-items: end; justify-items: center; background: rgba(5, 4, 4, .62); }
#sheet .pane { width: min(460px, 100%); padding: 26px 24px calc(var(--sab) + 26px); border-top: 1px solid var(--gold-dim); background: #0b0908; display: grid; gap: 20px; text-align: left; touch-action: pan-y; }
#sheet label { display: grid; gap: 10px; font: 400 11px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
#sheet input[type=range] { width: 100%; accent-color: #E3C07A; }
#sheet input[type=text] { padding: 10px 12px; border: 1px solid var(--gold-dim); border-radius: 10px; background: transparent; color: var(--ivory); font: 400 19px var(--serif); -webkit-user-select: text; user-select: text; }
#sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }
#sheet .go { padding: 13px 20px; }
.danger { color: #D9867C !important; border-color: rgba(182, 69, 58, .55) !important; }
#toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 26px); z-index: 40; transform: translateX(-50%); padding: 10px 16px; border: 1px solid var(--gold-dim); border-radius: 999px; background: rgba(5, 4, 4, .88); font: 400 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); white-space: nowrap; opacity: 0; transition: opacity .4s ease; pointer-events: none; }
#toast.on { opacity: 1; }

#rotate { z-index: 50; }
@media (orientation: landscape) and (max-height: 520px) { #rotate { display: grid !important; } }
@media (prefers-reduced-motion: reduce) { #grain { animation: none; } .line, #story p { transition-duration: .01ms; } body.quake #cam, body.quake #still, body.quake #fx { animation: none; } }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="still"></canvas>
<canvas id="ghost"></canvas>
<canvas id="fx"></canvas>
<div id="grain"></div>
<div id="vignette"></div>

<div id="hud" hidden><span class="door" id="doorLabel">Door I</span><span id="timer"></span><button id="reread" type="button" hidden>Read again</button></div>
<div id="story" aria-live="polite"></div>

<section class="screen" id="splash">
  <div class="col">
    <svg class="sigil-big" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40"/><path d="M35 76 V46 A15 15 0 0 1 65 46 V76"/><line x1="12" y1="76" x2="88" y2="76"/><circle cx="50" cy="58" r="5"/></svg>
    <h1 class="title">Threshold</h1>
  </div>
</section>

<section class="screen" id="perm" hidden>
  <div class="col">
    <p class="eyebrow">Before the door opens</p>
    <p class="lead">The door needs to see through your camera and feel how you hold the phone.</p>
    <p class="fine">Nothing you show it leaves this phone. When your phone asks, allow the camera and motion.</p>
    <button class="go" id="allow" type="button">Allow and continue</button>
    <p class="fine" id="permNote" hidden></p>
  </div>
</section>

<section class="screen" id="interlude" hidden><div class="col" id="interCol"></div></section>
<section class="screen" id="end" hidden><div class="col" id="endCol"></div></section>
<section class="screen" id="rotate" hidden><div class="col"><p class="lead">Hold the phone upright.</p><p class="fine">The doors only open in portrait.</p></div></section>
<div id="toast" role="status"></div>
<script src="game.js"></script>
</body>
</html>
